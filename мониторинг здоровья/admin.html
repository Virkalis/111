<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GameKeys Shop - Панель администратора</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><nav class="nav"><div class="logo">KEY STORE ADMIN</div><div class="nav-links"><a href="main.html">На сайт</a><a href="admin.html" class="active">Панель</a></div></nav></header><main class="container"><h1 class="page-title">Панель администратора</h1><div class="dashboard-grid"><div class="dashboard-card"><h2>Товары</h2><div class="big-number">12</div><p>Позиции каталога </p></div><div class="dashboard-card"><h2>Ключи</h2><div class="big-number">120</div><p>Начальный склад ключей из </p></div><div class="dashboard-card"><h2>Продажи</h2><div class="big-number" id="sales-count">0</div><p>Заказы текущего браузера</p></div></div><section class="table-card"><h2>Последние продажи</h2><div id="sales"></div></section></main><script>const orders=JSON.parse(localStorage.getItem('orders')||'[]');document.getElementById('sales-count').textContent=orders.length;document.getElementById('sales').innerHTML=orders.length?orders.slice(0,10).map(o=>`<div class="table-row"><b>${o.id}</b><span>${o.email}</span><span>${o.total} ₽</span><span>Оплачен</span></div>`).join(''):'<p>Продаж пока нет.</p>';</script></body></html>
