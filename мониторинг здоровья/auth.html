<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GameKeys — Вход и регистрация</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><style>.auth-wrap{max-width:520px;margin:2rem auto}.auth-tabs{display:flex;gap:.5rem;margin-bottom:1rem}.auth-tabs button{flex:1}.auth-card{background:#fff;padding:2rem;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.auth-card h2{margin-top:0}.auth-note{font-size:.9rem;color:#666;margin-top:1rem}.demo-box{margin-top:1rem;padding:1rem;background:#f4f7fb;border-radius:10px}</style></head><body><header class="header"><nav class="nav"><div class="logo">KEY STORE</div><div class="nav-links"><a href="main.html">Главная</a><a href="catalog.html">Каталог</a><a href="cart.html">Корзина <span class="cart-count">0</span></a><a href="purchases.html">Мои покупки</a><a href="profile.html">Кабинет</a></div></nav></header><main class="container"><div class="auth-wrap"><div class="auth-tabs"><button class="btn" id="login-tab">Вход</button><button class="btn" id="register-tab">Регистрация</button></div><section class="auth-card" id="login-form"><h2>Вход в аккаунт</h2><div class="form-group"><label>Email</label><input id="login-email" class="form-input" type="email" placeholder="you@example.com"></div><div class="form-group"><label>Пароль</label><input id="login-password" class="form-input" type="password" placeholder="Минимум 6 символов"></div><button class="btn" onclick="doLogin()">Войти</button><div id="login-status"></div><div class="demo-box"></div></section><section class="auth-card" id="register-form" style="display:none"><h2>Создать аккаунт</h2><div class="form-group"><label>Имя</label><input id="reg-name" class="form-input"></div><div class="form-group"><label>Email</label><input id="reg-email" class="form-input" type="email"></div><div class="form-group"><label>Пароль</label><input id="reg-password" class="form-input" type="password"></div><div class="form-group"><label>Повторите пароль</label><input id="reg-password2" class="form-input" type="password"></div><button class="btn" onclick="doRegister()">Зарегистрироваться</button><div id="register-status"></div></section><p class="auth-note">Учебная версия: аккаунты хранятся в localStorage браузера. Для реального сайта пароли должны храниться только на сервере в хешированном виде.</p></div></main><script>const setTab=(login)=>{document.getElementById('login-form').style.display=login?'block':'none';document.getElementById('register-form').style.display=login?'none':'block'};document.getElementById('login-tab').onclick=()=>setTab(true);document.getElementById('register-tab').onclick=()=>setTab(false);function status(id,msg,ok=false){const e=document.getElementById(id);e.className='form-status '+(ok?'success':'error');e.textContent=msg}function goBack(){const p=new URLSearchParams(location.search).get('return');location.href=p||'profile.html'}function doLogin(){const r=GameKeys.loginUser(document.getElementById('login-email').value,document.getElementById('login-password').value);if(!r.ok){status('login-status',r.error);return}status('login-status','Вход выполнен. Перенаправление...',true);setTimeout(goBack,400)}function doRegister(){const p=document.getElementById('reg-password').value;if(p!==document.getElementById('reg-password2').value){status('register-status','Пароли не совпадают.');return}const r=GameKeys.registerUser(document.getElementById('reg-name').value,document.getElementById('reg-email').value,p);if(!r.ok){status('register-status',r.error);return}status('register-status','Аккаунт создан. Добро пожаловать!',true);setTimeout(goBack,500)}
</script></body></html>
