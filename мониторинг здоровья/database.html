<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GameKeys — База данных</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><style>.db-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}.db-card{background:#fff;border:1px solid #eee;border-radius:16px;padding:1.2rem}.db-card code{font-size:.9rem}.db-number{font-size:2rem;font-weight:800}</style></head><body><header class="header"><nav class="nav"><div class="logo">KEY STORE</div><div class="nav-links"><a href="main.html">Главная</a><a href="catalog.html">Каталог</a><a href="purchases.html">Мои покупки</a><a href="profile.html">Кабинет</a></div></nav></header><main class="container"><h1 class="page-title">База данных магазина</h1><p>Учебная визуализация складской базы. При покупке ключ переносится из «В наличии» в «Проданные» и привязывается к заказу и аккаунту.</p><div class="db-grid"><div class="db-card"><h3>Ключей в наличии</h3><div id="stock" class="db-number">—</div></div><div class="db-card"><h3>Продано</h3><div id="sold" class="db-number">—</div></div><div class="db-card"><h3>Заказов</h3><div id="orders" class="db-number">—</div></div><div class="db-card"><h3>Пользователей</h3><div id="users" class="db-number">—</div></div></div></main><script>async function init(){await GameKeys.ensureInventory();document.getElementById('stock').textContent=GameKeys.getAvailableInventory().length;document.getElementById('sold').textContent=GameKeys.readJSON('soldKeys',[]).length;document.getElementById('orders').textContent=GameKeys.readJSON('orders',[]).length;document.getElementById('users').textContent=GameKeys.getUsers().length}init();</script></body></html>
