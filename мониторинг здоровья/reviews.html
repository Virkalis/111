<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GameKeys — Отзывы</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><header class="header"><nav class="nav"><div class="logo">KEY STORE</div><div class="nav-links"><a href="main.html">Главная</a><a href="catalog.html">Каталог</a><a href="cart.html">Корзина <span class="cart-count">0</span></a><a href="purchases.html">Мои покупки</a><a href="reviews.html" class="active">Отзывы</a><a href="profile.html">Кабинет</a><a data-auth-link href="auth.html">Войти</a></div></nav></header><main class="container"><h1 class="page-title">Отзывы покупателей</h1><div class="reviews-summary"><strong>4.9</strong><span>★★★★★</span><p>Оставить отзыв можно после покупки товара.</p></div><div id="reviews-list" class="review-list"></div><section class="form-card"><h2>Оставить отзыв</h2><div id="review-auth" class="form-status"></div><div class="form-group"><label>Купленный товар</label><select id="review-game" class="form-input"></select></div><div class="form-group"><label>Оценка</label><select id="review-rating" class="form-input"><option value="5">5 — отлично</option><option value="4">4 — хорошо</option><option value="3">3 — нормально</option><option value="2">2 — плохо</option><option value="1">1 — очень плохо</option></select></div><div class="form-group"><label>Текст отзыва</label><textarea id="review-text" class="form-input" rows="4" placeholder="Расскажите о покупке"></textarea></div><button class="btn" onclick="saveReview()">Опубликовать отзыв</button><div id="review-status"></div></section></main><script>const seed=[{name:'Алексей',game:'Cyberpunk 2077',rating:5,text:'Ключ пришёл сразу после оплаты, активация прошла успешно.'},{name:'Мария',game:'Elden Ring',rating:5,text:'Удобный каталог и понятная инструкция.'}];function renderReviews(){const all=[...seed,...GameKeys.readJSON('reviews',[])];document.getElementById('reviews-list').innerHTML=all.map(r=>`<article class="review-card"><div class="review-head"><strong>${r.name}</strong><span>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div><small>${r.game}</small><p>${r.text}</p><small>${r.date||''}</small></article>`).join('')}function setup(){renderReviews();const auth=document.getElementById('review-auth');if(!GameKeys.isLoggedIn()){auth.className='form-status error';auth.textContent='Войдите в аккаунт, чтобы оставить отзыв.';return}const orders=GameKeys.getUserOrders();const games=[...new Set(orders.flatMap(o=>o.items.map(i=>i.gameName)))];const sel=document.getElementById('review-game');if(!games.length){auth.className='form-status error';auth.textContent='Отзывы доступны после первой покупки.';document.querySelector('.form-card .btn').disabled=true;return}sel.innerHTML=games.map(g=>`<option>${g}</option>`).join('')}function saveReview(){if(!GameKeys.requireAuth('Войдите в аккаунт, чтобы оставить отзыв.'))return;const orders=GameKeys.getUserOrders();const game=document.getElementById('review-game').value;if(!orders.some(o=>o.items.some(i=>i.gameName===game))){document.getElementById('review-status').innerHTML='<div class="form-status error">Оставить отзыв можно только на купленный товар.</div>';return}const text=document.getElementById('review-text').value.trim();if(!text){document.getElementById('review-status').innerHTML='<div class="form-status error">Введите текст отзыва.</div>';return}const u=GameKeys.currentUser();const arr=GameKeys.readJSON('reviews',[]);arr.unshift({id:'review-'+Date.now(),userId:u.id,name:u.name,game,rating:Number(document.getElementById('review-rating').value),text,date:new Date().toLocaleDateString('ru-RU')});GameKeys.writeJSON('reviews',arr);document.getElementById('review-text').value='';document.getElementById('review-status').innerHTML='<div class="form-status success">Спасибо! Отзыв опубликован.</div>';renderReviews()}document.addEventListener('DOMContentLoaded',setup);</script></body></html>
